<!doctype html>
<html><head><meta charset="utf-8">
<title>PuzzlePiece Logo Title</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#184e45}
.abs{position:absolute}
#cream{inset:0;background:radial-gradient(110% 60% at 20% 10%, #f4edc4 0%, #f6f1df 40%, #f3efe5 75%, #efebe1 100%)}
.shard{width:139px;height:147px;will-change:transform}
.ltr{height:118px;background:url(assets/word.png) no-repeat;will-change:transform}
</style></head>
<body>
<div id="stage" class="abs" style="inset:0;transform-origin:540px 960px">
  <div id="cream" class="abs"></div>
  <svg class="abs" style="left:0;top:0" width="1080" height="1920" id="fx"></svg>
  <div id="shards"></div>
  <img id="icon" class="abs" src="assets/icon.png" style="width:139px;height:147px">
  <div id="word" class="abs" style="left:257px;top:901px;width:722px;height:118px"></div>
  <div id="line" class="abs" style="left:480px;top:1080px;width:120px;height:5px;border-radius:3px;background:#f2d77a"></div>
</div>

<script src="art.js"></script>
<script src="assets/icon_mask.js"></script>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, m) => a + (b - a) * m;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;   // ease-in-out cubic
const eo = x => 1 - Math.pow(1 - x, 3);
// damped spring, 0 → 1 with natural overshoot; dt = seconds since start
const spring = (dt, f = 1.6, z = .55) => {
  if (dt <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
};
const $ = id => document.getElementById(id);

// Lockup geometry (icon 139×147 · 18 px gap · wordmark 722×118), centred on 1080
const IX = 100, IY = 887, CX = 540, CY = 960;
const ICON_CENTRE_X = 540 - 69.5;

// Five shards in the logo's own colours, all the icon's silhouette, spiralling in to stack
const SH = ['#4caf3a', '#5ccfcf', '#f5a800', '#d62a22', '#6b1830'];
$('shards').innerHTML = SH.map((c, i) => `<div class="abs shard" id="sh${i}" style="background:${c};-webkit-mask:url(${ICON_MASK}) center/contain no-repeat;mask:url(${ICON_MASK}) center/contain no-repeat"></div>`).join('');

// Wordmark split into its 11 letters (column ranges inside word.png)
const L = [[0, 73], [80, 150], [161, 219], [229, 287], [296, 328], [333, 393], [403, 477], [484, 516], [521, 581], [591, 656], [657, 722]];
$('word').innerHTML = L.map(([a, b], i) => `<div class="abs ltr" id="l${i}" style="left:${a}px;width:${b - a}px;background-position:-${a}px 0;transform-origin:50% 100%"></div>`).join('');

// FX: ripple ring + accent pieces at different depths (parallax)
const ACC = [[150, 300, '#4caf3a', .75, -25, .35], [930, 330, '#5ccfcf', .6, 18, .6], [140, 1620, '#d62a22', .5, 10, .8], [940, 1660, '#f5a800', .7, -12, .5]];
$('fx').innerHTML = `<circle id="ring" cx="${CX}" cy="${CY}" r="0" fill="none" stroke="#f9d272" stroke-width="6" opacity="0"/>` +
  `<circle id="ring2" cx="${CX}" cy="${CY}" r="0" fill="none" stroke="#f9d272" stroke-width="3" opacity="0"/>` +
  ACC.map(([x, y, c], i) => `<g id="ac${i}"><path d="${PIECE}" transform="translate(-50 -50)" fill="${c}" opacity=".9"/></g>`).join('');

function render(t) {
  // ── 1. shards spiral in on deep green, stacking into the icon at t≈1.25 ──
  SH.forEach((_, i) => {
    const p = eio(prog(t, 0 + i * .07, 1.05));
    const a0 = i * 72 * Math.PI / 180, a = a0 + (1 - p) * 3.4 * (i % 2 ? 1 : -1);
    const r = 950 * Math.pow(1 - p, 1.6);
    const x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r;
    const s = $('sh' + i);
    s.style.left = x - 69.5 + 'px'; s.style.top = y - 73.5 + 'px';
    s.style.opacity = prog(t, i * .07, .15) * (1 - prog(t, 1.22, .14)) * .92;
    s.style.transform = `rotate(${(1 - p) * 540 * (i % 2 ? -1 : 1)}deg) scale(${1.25 * (.7 + .3 * p)})`;
    s.style.mixBlendMode = 'normal';
  });

  // ── 2. the real icon "clicks" in: spring pulse + double ripple ──
  const icon = $('icon');
  const snap = 1.18;
  const pulse = t > snap ? 1 + .12 * Math.exp(-5 * (t - snap)) * Math.cos(14 * (t - snap)) : 1;
  const glide = spring(t - 1.9, 1.25, .66);                 // move into lockup
  const ix = lerp(ICON_CENTRE_X, IX, glide), k = lerp(1.25, 1, glide) * pulse;
  const settle = t > 3.2 ? 2.5 * Math.sin((t - 3.2) * 2.2) * Math.exp(-(t - 3.2) * .4) : 0;
  icon.style.left = ix + 'px'; icon.style.top = IY + 'px';
  icon.style.opacity = prog(t, snap - .06, .12);
  icon.style.transform = `rotate(${(1 - glide) * -8 + settle}deg) scale(${k})`;
  icon.style.filter = `drop-shadow(0 ${10 * (1 - glide) + 4}px ${18 - 8 * glide}px rgba(0,0,0,${.28 - .16 * prog(t, 1.3, .6)}))`;
  [['ring', snap, 1.0, 520], ['ring2', snap + .12, 1.2, 700]].forEach(([id, s, d, R]) => {
    const p = prog(t, s, d), e = eo(p);
    $(id).setAttribute('r', 80 + R * e); $(id).setAttribute('opacity', p > 0 && p < 1 ? (1 - e) * .9 : 0);
  });

  // ── 3. iris opens from the icon into warm cream ──
  const iris = eio(prog(t, 1.3, .75));
  $('cream').style.clipPath = `circle(${iris * 1250}px at ${CX}px ${CY}px)`;

  // ── 4. wordmark letters spring up one by one as the icon glides over ──
  L.forEach((_, i) => {
    const dt = t - (2.35 + i * .055), s = spring(dt, 1.7, .5);
    const el = $('l' + i);
    el.style.opacity = clamp(dt / .12);
    el.style.transform = `translateY(${(1 - s) * 90}px) rotate(${(1 - s) * (i % 2 ? 10 : -10)}deg) scaleY(${.7 + .3 * s})`;
  });

  // ── 5. underline draws, accents float in with parallax ──
  const ln = eo(prog(t, 3.2, .55)); $('line').style.opacity = ln; $('line').style.transform = `scaleX(${ln})`;
  ACC.forEach(([x, y, , kp, rp, depth], i) => {
    const s = spring(t - (2.6 + i * .12), 1.3, .6);
    const drift = (t - 2.6) * 14 * depth;
    $('ac' + i).setAttribute('transform', `translate(${x + (i % 2 ? -drift : drift) * .4} ${y - drift + Math.sin(t * 1.1 + i) * 6}) rotate(${rp + (1 - s) * 90 + Math.sin(t * .7 + i) * 5}) scale(${kp * Math.max(s, 0)})`);
  });

  // ── 6. slow camera push-in for life during the hold ──
  const cam = eio(prog(t, 1.6, 3.4));
  $('stage').style.transform = `scale(${1 + .045 * cam}) translateY(${-6 * cam}px)`;
}
window.render = render; render(0);
</script>
</body></html>
