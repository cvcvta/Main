<!doctype html>
<html><head><meta charset="utf-8">
<title>PuzzlePiece Logo Title</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(110% 60% at 20% 10%, #f4edc4 0%, #f6f1df 40%, #f3efe5 75%, #efebe1 100%)}
.abs{position:absolute}
</style></head>
<body>
<svg class="abs" style="left:0;top:0" width="1080" height="1920" id="pieces"></svg>
<!-- lockup: icon 139×147, wordmark 722×118, 18 px gap → 879 px wide, centred -->
<img id="icon" class="abs" src="assets/icon.png" style="left:100px;top:887px;width:139px;height:147px;transform-origin:50% 50%">
<img id="word" class="abs" src="assets/word.png" style="left:257px;top:901px;width:722px;height:118px">
<div id="line" class="abs" style="left:480px;top:1080px;width:120px;height:5px;border-radius:3px;background:#f2d77a;transform-origin:50% 50%"></div>

<script src="art.js"></script>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - x, 3);
const eb = x => { const c = 1.2; x -= 1; return 1 + (c + 1) * x * x * x + c * x * x; };
const prog = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, m) => a + (b - a) * m;
const $ = id => document.getElementById(id);

const P = [[150, 260, '#5cb85c', .7, -25], [930, 300, '#6ccfd0', .6, 18], [150, 1640, '#e5674f', .5, 10], [930, 1680, '#f0b24a', .65, -12]];
$('pieces').innerHTML = P.map(([x, y, c], i) => `<g class="pc" data-i="${i}"><path d="${PIECE}" transform="translate(-50 -50)" fill="${c}" opacity=".85"/></g>`).join('');

function render(t) {
  // icon: pops in at screen centre, turning into place…
  const pop = prog(t, .2, .9), slide = eo(prog(t, 1.2, .8));
  const k = lerp(.2, 1.3, eb(pop)), kk = lerp(k, 1, slide);
  const cx = lerp(540 - 69.5, 100, slide);
  const icon = $('icon');
  icon.style.opacity = eo(prog(t, .2, .4));
  icon.style.left = cx + 'px';
  icon.style.transform = `rotate(${lerp(-120, 0, eo(pop)) + (t > 3 ? 3 * Math.sin((t - 3) * 2.4) : 0)}deg) scale(${kk})`;
  // …then the wordmark reveals left to right beside it
  const r = eo(prog(t, 1.85, .9)), word = $('word');
  word.style.opacity = eo(prog(t, 1.85, .4));
  word.style.clipPath = `inset(0 ${(1 - r) * 100}% 0 0)`;
  word.style.transform = `translateX(${(1 - r) * -24}px)`;
  // brand underline
  const l = eo(prog(t, 2.8, .6)); $('line').style.opacity = l; $('line').style.transform = `scaleX(${l})`;
  // soft accent pieces drift in
  document.querySelectorAll('.pc').forEach(g => {
    const i = +g.dataset.i, [x, y, , kp, rp] = P[i], e = eo(prog(t, 1.9 + i * .15, 1.0));
    g.setAttribute('transform', `translate(${x} ${y + Math.sin(t * .9 + i * 2) * 10}) rotate(${rp + Math.sin(t * .6 + i) * 6}) scale(${kp * e})`);
  });
}
window.render = render; render(0);
</script>
</body></html>
