const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => (k = clamp(k)) >= 1 ? 1 : 1 - Math.pow(2, -10 * k);           // land: decelerate
const eIn = k => (k = clamp(k)) <= 0 ? 0 : Math.pow(2, 10 * (k - 1));            // leave: accelerate
const eIO = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };

const spring = k => { k = Math.max(0, k); return 1 - Math.exp(-7 * k) * Math.cos(11 * k); };   // the one spring
// piecewise track: [[t, v, ease?], ...] ease applies on the segment ending at that key
function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, ez] = keys[i], [t0, v0] = keys[i - 1];
    if (t <= t1) { const k = (t - t0) / (t1 - t0); return lerp(v0, v1, (ez || eIO)(k)); }
  }
  return keys[keys.length - 1][1];
}

function caption(parent, { y, lines, out, lh = 1.06, x = 0 }) {
  const root = $('div', 'cap', parent); css(root, { top: y + 'px', left: x + 'px' });
  const items = [];
  lines.forEach(L => {
    const ln = $('div', 'ln', root);
    css(ln, { fontSize: L.size + 'px', lineHeight: lh, color: L.color || '#111116', fontWeight: L.weight || 600 });
    L.words.forEach(([txt, t, col], j) => {

      if (j < L.words.length - 1) ln.appendChild(document.createTextNode(' '));
      items.push({ inn, t, idx: items.length });
    });
  });
  const c = { root, items, out };
  c.update = t => {
    let any = false;
    for (const it of c.items) {
      const k = (t - (it.t - 0.07)) / 0.40;                   // lands ~2f before it's heard
      let y = (1 - eOut(k)) * 112, r = (1 - eOut(k)) * 4;
      if (k < 0) { y = 112; r = 4; }
      if (c.out != null) { const ke = (t - c.out - it.idx * 0.022) / 0.26; if (ke > 0) { y = -eIn(ke) * 112; r = -eIn(ke) * 3; } }

    c.root.style.display = any ? 'block' : 'none';
  };

}

  const eyes = [css($('div', 'eye', m), { left: '232px', top: '178px' }), css($('div', 'eye', m), { left: '300px', top: '172px' })];
  eyes.forEach(e => $('i', '', e));

  o.set = ({ x, y, r, sx = 1, sy = 1, rot = 0, look = 0, blink = 1, glowA = 0, shadow = 0, floorY = null, t = 0, z = 5, vis = true }) => {

      sh.style.transform = `translate(${x}px,${floorY}px) scale(${s * (1 - lift * .5)},${s * (1 - lift * .5)})`;
      sh.style.opacity = shadow * (1 - lift);

  };
  return o;
}

let GRAIN, grainTiles = [];
function makeGrain() {
  for (let i = 0; i < 8; i++) {
    const g = document.createElement('canvas'); g.width = 540; g.height = 960; const x = g.getContext('2d');
    const d = x.createImageData(540, 960); let s = i * 9973 + 1;
    for (let p = 0; p < d.data.length; p += 4) { s = (s * 16807) % 2147483647; const v = (s / 2147483647) * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; }
    x.putImageData(d, 0, 0); grainTiles.push(g.toDataURL('image/png'));
  }
}

//  RENDER
// =====================================================================================
const show = (n, on) => { L[n].style.display = on ? 'block' : 'none'; };
function moOff() { MO.set({ vis: false }); }

window.renderFrame = function (t) {
  for (const n of ['office', 'world', 'stageDark', 'spot', 'cta']) show(n, false);
  moOff();
  if (t < B.roles) office(t);
  else if (t < B.match) world(t);
  else if (t < B.spot) dark(t);
  else if (t < B.cta) spot(t);
  else cta(t);
  for (const c of CAPS) c.update(t);
  GRAIN.style.backgroundImage = `url(${grainTiles[Math.floor(t * 30) % 8]})`;
  GRAIN.style.backgroundSize = '1080px 1920px';
};

// ---------------- office: one push from 0 to the dive ----------------
function office(t) {
  show('office', true);
  const tq = wt(5, 'quit');
  // camera: slow continuous push, a bump on every cost, then the dive into Mo
  let s = 1.02 + 0.13 * sine(t / B.brand);
  let ty = -20 * sine(t / B.brand);
  for (const tc of [wt(3, 'Salary.'), wt(4, 'Benefits.'), wt(4, 'Months')]) { const k = (t - tc) / 0.5; if (k > 0 && k < 1) s += 0.018 * Math.sin(Math.PI * k) * (1 - k); }
  // after "quit": empty desk
  const empty = t >= tq;
  L.desk.style.display = empty ? 'none' : 'block';
  L.empty.style.display = empty ? 'block' : 'none';
  // grade: each cost greys the room a step; the empty room is cool and quiet
  let gs = 0; [wt(3, 'Salary.'), wt(4, 'Benefits.'), wt(4, 'Months')].forEach((tc, j) => gs += 0.22 * eOut((t - tc) / 0.3));
  if (empty) gs = lerp(0.55, 0.0, eOut((t - P(7).start + 0.2) / 0.8));
  L.plate.style.filter = `grayscale(${gs}) brightness(${1 - gs * 0.25})`;
  L.dim.style.opacity = 0;
  // Mo: streaks in on "Mo", sits on the desk, leaves up-frame on "Add up"
  const tMo = wt(1, 'Mo') - 0.12, tLeave = B.costs - 0.05;
  const deskY = 1640;
  if (t > tMo - 0.05 && t < tLeave + 0.5) {
    const k = (t - tMo) / 0.55, kl = (t - tLeave) / 0.4;
    let x = lerp(1500, 860, eOut(k)), y = lerp(900, deskY - 92, eOut(k)), r = lerp(260, 88, eOut(k));
    if (kl > 0) { x += eIn(kl) * 300; y -= eIn(kl) * 1500; r = lerp(88, 120, eIn(kl)); }
    MO.set({ x, y, r, rot: lerp(-30, 0, eOut(k)), look: -0.8, blink: blinkAt(t, wt(1, 'today.') + 0.15), shadow: .8, floorY: deskY, t, glowA: 0 });
  }
  // brand: Mo falls into the empty chair (the one spring), then the dive
  const tFall = P(7).start - 0.32, tLand = tFall + 0.34, tDive = B.roles - 0.42;
  const seat = { x: 540, y: 1255 };
  if (t > tFall) {
    let y, sx = 1, sy = 1, r = 170;
    if (t < tLand) { const k = (t - tFall) / (tLand - tFall); y = lerp(-300, seat.y, k * k); r = lerp(240, 170, k); sy = 1 + 0.12 * k; sx = 1 - 0.08 * k; }
    else { const k = (t - tLand) / 0.6; y = seat.y; const sq = (1 - spring(k)) ; sx = 1 - sq * 0.22; sy = 1 + sq * 0.22; y += -sq * 40; }
    let x = seat.x;
    // dive: camera accelerates into Mo
    if (t > tDive) { const k = (t - tDive) / (B.roles - tDive); const g = eIn(k); r = lerp(170, 2600, g); y = lerp(seat.y, 960, g); s *= lerp(1, 7, g); }
    MO.set({ x, y, r, sx, sy, look: Math.sin(t * 1.3) * .3, blink: blinkAt(t, wt(7, 'team') + 0.1), shadow: 1, floorY: seat.y + 175, t, glowA: 0 });
  }
  const ox = t > tDive ? 0 : 0;
  L.plate.style.transform = `translate(${ox}px,${ty}px) scale(${s})`;
  // wordmark arrives from oversize, centred over the wall
  const kw = (t - wt(7, 'Persona') + 0.06) / 0.5;
  if (kw > 0) {
    const kx = (t - (B.roles - 0.32)) / 0.25;
    const sc = lerp(2.6, 1, eOut(kw)) * (kx > 0 ? lerp(1, 0.6, eIn(kx)) : 1);
    const yy = 270 - (kx > 0 ? eIn(kx) * 500 : 0);
    css(L.wm, { display: 'flex', left: '540px', top: yy + 'px', transform: `translate(-50%,-50%) scale(${sc})`, filter: `blur(${(1 - eOut(kw)) * 14}px)`, opacity: clamp(kw * 4) });
  } else L.wm.style.display = 'none';
}

// ---------------- Mo's world: track past the work, then the calendar ----------------
function world(t) {
  show('world', true);
  const t0 = B.roles, tCal = B.cal, tEnd = B.match;
  // camera keys: arrive at each fragment just before its word
  const tf = [t0, wt(9, 'writer.') - 0.28, wt(10, 'SEO') - 0.28, wt(11, 'Social') - 0.28, wt(11, 'ads.') - 0.22];
  const keys = [[t0 - 0.001, L.fpos[0][1] + 260]];
  keys.push([t0 + 0.55, L.fpos[0][1], eOut]);
  for (let i = 1; i < 5; i++) { keys.push([tf[i] - 0.02, L.fpos[i - 1][1] + 40]); keys.push([tf[i] + 0.42, L.fpos[i][1], eIO]); }
  keys.push([tCal - 0.1, L.fpos[4][1] + 60]); keys.push([tCal + 0.5, 6820, eIO]);
  const keysX = [[t0, 540]]; for (let i = 1; i < 5; i++) { keysX.push([tf[i] - 0.02, L.fpos[i - 1][0]]); keysX.push([tf[i] + 0.42, L.fpos[i][0], eIO]); }
  keysX.push([tCal - 0.1, L.fpos[4][0]]); keysX.push([tCal + 0.5, 600, eIO]); keysX.push([tEnd, 700, x => x]);
  const cy = track(t, keys), cx = track(t, keysX);
  // zoom: opens at 1.35 (still diving), settles to 1; calendar is magnified and drifts
  let z = track(t, [[t0, 1.45], [t0 + 0.6, 1.0, eOut], [tCal - 0.1, 1.0], [tCal + 0.5, 0.86, eIO], [tEnd - 0.3, 0.92, x => x]]);
  const rz = track(t, [[t0, 4], [t0 + 0.6, 0, eOut], [tCal - 0.1, 0], [tCal + 0.5, -2, eIO], [tEnd, -1, x => x]]);
  // exit: the whole world collapses back into Mo's glass
  const tCol = tEnd - 0.34; let clip = 1600, cs = 1;
  if (t > tCol) { const k = eIn((t - tCol) / (tEnd - tCol)); clip = lerp(1600, 150, k); cs = lerp(1, 0.18, k); }
  L.cam.style.transform = `scale(${z * cs}) rotate(${rz}deg) translate(${540 - cx}px,${960 - cy}px)`;
  L.worldMask.style.clipPath = clip < 1590 ? `circle(${clip}px at 540px 960px)` : 'none';
  L.worldMask.style.background = '#0d0a1a';
  // depth: neighbours soft, active sharp
  L.frags.forEach((f, i) => { const d = Math.abs(cy - L.fpos[i][1]) / 900; f.style.filter = `blur(${clamp(d - 0.25, 0, 1) * 10}px)`; });
  L.cal.style.filter = `blur(${clamp(Math.abs(cy - 6820) / 900 - 0.25, 0, 1) * 10}px)`;
  // blobs drift
  L.blobs.forEach((b, i) => css(b, { left: (100 + 300 * Math.sin(t * .4 + i * 2)) + 'px', top: (300 + 500 * i + 200 * Math.cos(t * .3 + i)) + 'px' }));
  // calendar: chips cascade in, status flips, ticks on "posted"
  const tP = wt(13, 'planned,'), tM = wt(13, 'made,'), tPo = wt(13, 'posted.');
  L.cal.status.textContent = t >= tP ? 'PLAN READY' : 'PLANNING…';
  css(L.cal.status, { background: t >= tP ? '#6938F5' : '#EAE6F0', color: t >= tP ? '#fff' : '#6938F5' });
  L.cal.cells.forEach((c, j) => {
    const at = tCal + 0.15 + j * 0.055, k = (t - at) / 0.32;
    c.chip.style.transform = `translateY(${(1 - eOut(k)) * 40}px) scale(${k <= 0 ? 0.0001 : lerp(1.25, 1, eOut(k))})`;
    c.chip.style.opacity = k <= 0 ? 0 : 1;
    const kt = (t - (tPo - 0.05 + j * 0.022)) / 0.25;
    c.tick.style.transform = `scale(${kt <= 0 ? 0.0001 : lerp(1.8, 1, eOut(kt))})`;
    c.tick.style.opacity = kt <= 0 ? 0 : 1;
    c.chip.style.filter = t > tM ? 'saturate(1.15)' : 'none';
  });
}

// ---------------- dark stage: breath, plans, night, the booking ----------------
function dark(t) {
  show('stageDark', true);
  const t0 = B.match, tPl = B.plans, tNight = B.always, tNos = B.nos;
  // light: violet stage -> night navy
  const night = eIO((t - tNight + 0.25) / 0.5);
  const gA = lerp(0.55, 0.22, night);
  L.darkBg.style.background = `radial-gradient(ellipse at 50% 46%,rgba(105,56,245,${gA}) 0%,rgba(50,25,120,${gA * 0.4}) 40%,rgba(0,0,0,0) 72%),${night > 0.5 ? '#06081A' : '#0B0A12'}`;
  // Mo size per plan step (camera feels like it pulls back as Mo grows)
  const steps = [P(15).start, P(16).start, P(17).start];
  let r = track(t, [[t0, 150], [t0 + 0.4, 170, eOut], [steps[0] - 0.05, 170], [steps[0] + 0.45, 120, eOut], [steps[1] - 0.05, 120], [steps[1] + 0.45, 150, eOut], [steps[2] - 0.05, 150], [steps[2] + 0.45, 185, eOut], [tNight - 0.2, 185]]);
  let x = 540, y = track(t, [[t0, 960], [steps[0], 960], [steps[0] + 0.45, 1040, eOut]]);
  y += Math.sin((t - t0) * 2.2) * 8;
  // night: Mo shrinks into the notification avatar
  const tN = tNight - 0.15, nk = eOut((t - tN) / 0.55);
  const notifY = track(t, [[tN, 1500], [tN + 0.55, 820, eOut], [tNos - 0.05, 790], [tNos + 0.5, 360, eIO]]);
  if (t > tN) { const scr = track(t, [[P(19).start, 0], [wt(19, 'chase.') + 0.2, -150, eIO]]); x = lerp(540, 158, nk); y = lerp(y, notifY - 168 + scr, nk); r = lerp(r, 44, nk); }
  MO.set({ x, y, r, look: t < tN ? Math.sin((t - t0) * 1.1) * 0.6 : 0, blink: Math.min(blinkAt(t, t0 + 0.75), blinkAt(t, steps[2] + 0.6)), glowA: lerp(1, 0, nk), t });
  // satellites: what Mo handles orbits in, step by step
  const exitK = eIn((t - (tNight - 0.25)) / 0.35);
  L.satItems.forEach((it, i) => {
    const at = steps[it.step] + 0.08 + (i % 2) * 0.12, k = (t - at) / 0.5;
    if (k <= 0 || exitK >= 1) { it.f.style.display = 'none'; return; }
    it.f.style.display = 'block';
    const ang = it.a0 + (t - t0) * 0.55;
    const R = lerp(900, 360, eOut(k)) + exitK * 900, rx = R * 1.05, ry = R * 0.55;
    const px = 540 + Math.cos(ang) * rx, py = y + Math.sin(ang) * ry, depth = Math.sin(ang);
    const sc = parseFloat(it.f.dataset.s) * (1 + depth * 0.25);
    const w = parseFloat(it.f.style.width), h = parseFloat(it.f.style.height);
    css(it.f, { left: (px - w / 2) + 'px', top: (py - h / 2) + 'px', transform: `scale(${sc}) rotate(${Math.cos(ang) * 6}deg)`, zIndex: depth > 0 ? 25 : 10, filter: `blur(${depth < 0 ? -depth * 5 : 0}px) brightness(${1 + depth * 0.08})` });
  });
  // notification lands from below, then the thread pushes it up
  if (t > tN) {
    const k = (t - tN) / 0.55;
    const scr = track(t, [[P(19).start, 0], [wt(19, 'chase.') + 0.2, -150, eIO]]);
    css(L.notif, { display: 'block', left: '90px', top: (notifY - 235 + scr) + 'px', transform: `scale(${lerp(1.18, 1, eOut(k))}) rotate(${(1 - eOut(k)) * -3}deg)` });
  } else L.notif.style.display = 'none';
  // thread
  if (t > tNos - 0.1) {
    L.thread.style.display = 'block';
    let yy = 720; const scroll = track(t, [[P(19).start, 0], [wt(19, 'chase.') + 0.2, -150, eIO]]);
    L.bubbles.forEach(([b, at], j) => {
      const k = (t - at) / 0.4; if (k <= 0) { b.style.display = 'none'; return; }
      b.style.display = 'block';
      b.style.top = (yy + scroll) + 'px';
      b.style.transform = `translateY(${(1 - eOut(k)) * 80}px) scale(${lerp(0.9, 1, eOut(k))})`;
      b.style.transformOrigin = b.style.right ? '100% 100%' : '0% 100%';
      yy += b.offsetHeight + 26;
    });
    const tc = wt(19, 'chase.') + 0.1, kc = (t - tc) / 0.5;
    if (kc > 0) css(L.confirm, { display: 'flex', left: '90px', top: (yy + scroll + 10) + 'px', transform: `scale(${lerp(1.3, 1, eOut(kc))})`, transformOrigin: '50% 30%' });
    else L.confirm.style.display = 'none';
  } else { L.thread.style.display = 'none'; L.confirm.style.display = 'none'; }
  // exit: the camera keeps rising as we cut to the spotlight
  const ke = eIn((t - (B.spot - 0.3)) / 0.3);
  L.stageDark.style.transform = `translateY(${-ke * 260}px)`;
}

// ---------------- spotlight ----------------
function spot(t) {
  show('spot', true);
  const k = (t - B.spot) / (B.cta - B.spot);
  // starts already moving (continues the upward camera), settles into a slow push
  const ty = lerp(220, 0, eOut(k * 2.2));
  const s = 1.06 + 0.07 * k + (1 - eOut(k * 2.2)) * 0.08;
  L.spotPlate.style.transform = `translateY(${ty}px) scale(${s})`;
  const ke = eIn((t - (B.cta - 0.22)) / 0.22);
  L.spotPlate.style.transform += ` scale(${1 + ke * 0.25})`;
}

// ---------------- CTA ----------------
function cta(t) {
  show('cta', true);
  const k = (t - B.cta) / (TL.duration - B.cta);
  const s = lerp(1.22, 1.04, eOut((t - B.cta) / 0.7)) + 0.03 * k;
  L.ctaPlate.style.transform = `scale(${s})`;
  // wordmark arrives first, quietly
  const kw = (t - B.cta - 0.1) / 0.5;
  css(L.wmEnd, { display: kw > 0 ? 'flex' : 'none', left: '540px', top: '200px', transform: `translate(-50%,-50%) scale(${lerp(1.8, 1, eOut(kw))})`, filter: `blur(${(1 - eOut(kw)) * 10}px)`, opacity: clamp(kw * 4) });
  // Mo flies in and settles between his hands
  const tm = wt(21, 'Mo') - 0.35, km = (t - tm) / 0.7;
  const table = 1700;
  if (km > 0) {
    const x = lerp(1400, 540, eOut(km)), y = lerp(700, table - 96, eOut(km)), r = lerp(330, 96, eOut(km));
    MO.set({ x, y, r, rot: lerp(40, 0, eOut(km)), look: track(t, [[tm, -1], [tm + 0.9, 0.2], [TL.duration, 0]]), blink: blinkAt(t, TL.duration - 0.75), shadow: 1, floorY: table, t, glowA: 0 });
  }
}

window.init = async function (timeline) {
  TL = timeline;
  const s = i => P(i).start;
  B = { hook: 0, costs: s(2) - 0.42, quit: s(5) - 0.12, brand: s(7) - 0.22, roles: s(8) - 0.16, cal: s(12) - 0.16, match: s(14) - 0.16, plans: s(15) - 0.12, always: s(18) - 0.12, nos: s(19) - 0.14, spot: s(20) - 0.16, cta: s(21) - 0.16, end: TL.duration };
  await Promise.all(['Inter Display', 'Inter', 'Bitstream Charter'].flatMap(f => [400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px "${f}"`))));
  makeGrain();
  build();
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  // events for the sound pass
  window.EVENTS = [
    { t: wt(1, 'Mo') - 0.12, kind: 'whoosh', gain: .6 }, { t: wt(1, 'Mo') + 0.2, kind: 'pop', gain: .9 },
    { t: B.costs, kind: 'whooshUp', gain: .5 },
    ...[wt(3, 'Salary.'), wt(4, 'Benefits.'), wt(4, 'Months')].map(t => ({ t, kind: 'thud', gain: .7 })),
    { t: wt(5, 'quit'), kind: 'cut', gain: .8 },
    { t: s(7) - 0.32, kind: 'fall', gain: .6 }, { t: s(7) + 0.02, kind: 'boom', gain: .9 },
    { t: B.roles - 0.45, kind: 'riser', dur: 0.45, gain: .7 }, { t: B.roles, kind: 'whoosh', gain: .7 },
    ...[wt(9, 'writer.'), wt(10, 'SEO'), wt(11, 'Social'), wt(11, 'ads.')].map(t => ({ t: t - 0.28, kind: 'swish', gain: .45 })),
    { t: B.cal, kind: 'whoosh', gain: .5 },
    ...Array.from({ length: 16 }, (_, j) => ({ t: B.cal + 0.15 + j * 0.055, kind: 'tick', gain: .5 })),
    { t: wt(13, 'posted.'), kind: 'pop', gain: .7 },
    { t: B.match - 0.34, kind: 'whooshDown', gain: .7 },
    ...[15, 16, 17].map(i => ({ t: s(i), kind: 'pop', gain: .5 })),
    { t: B.always, kind: 'whoosh', gain: .5 }, { t: B.always + 0.2, kind: 'ding', gain: .6 },
    ...L.bubbles.map(([, at]) => ({ t: at, kind: 'bubble', gain: .6 })),
    { t: wt(19, 'chase.') + 0.1, kind: 'boom', gain: .6 },
    { t: B.spot, kind: 'cut', gain: .6 }, { t: B.cta, kind: 'whoosh', gain: .5 },
    { t: wt(21, 'Mo') - 0.35, kind: 'whoosh', gain: .5 }, { t: wt(21, 'Mo') + 0.3, kind: 'pop', gain: .8 },
  ];
  return { B, EVENTS: window.EVENTS };
};
