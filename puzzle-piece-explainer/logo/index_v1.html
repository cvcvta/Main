<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puzzle Piece Logo</title>
<meta name="viewport" content="width=1080, height=1920">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#main { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(circle at 50% 46%, #fffaf0, #f1ead9 70%); }
.abs { position: absolute; }
</style>
</head>
<body>
<div id="main">
  <div id="cam" class="abs" style="inset:0;transform-origin:540px 900px">
    <img id="pz" class="abs" src="img/puzzle_a.png" style="left:390px;top:640px;width:300px;transform-origin:50% 50%">
    <img id="wm" class="abs" src="img/wordmark.png" style="left:270px;top:1040px;width:540px">
  </div>
</div>
<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const FPS = 30, DUR = 6, END = DUR * FPS;
const M = Motion.film({ fps: FPS, duration: DUR, width: 1080, height: 1920, clock: 'smooth' });
window.__ready = Motion.loaded().then(() => {
  const A = 12, LAND = 40;   // the piece crashes in from oversize, landing at ~1.3 s
  M.kf('#pz', 'opacity', [[0, 0], [A, 0], [A + 4, 1]]);
  M.kf('#pz', 'scale', [[0, 3.6], [A, 3.6], [LAND, 1, 'softLand'], [END, 1.04, 'softInOut']]);
  M.kf('#pz', 'rotation', [[0, -70], [A, -70], [LAND, 0, 'softLand'], [LAND + 60, 0], [END, 6, 'softInOut']]);
  M.kf('#pz', 'y', [[0, 0], [LAND, 0], [END, -12, 'softInOut']]);
  M.kf('#wm', 'opacity', [[0, 0], [LAND + 6, 0], [LAND + 14, 1]]);
  M.kf('#wm', 'y', [[0, 60], [LAND + 6, 60], [LAND + 26, 0, 'softLand']]);
  M.kf('#cam', 'scale', [[0, 1], [END, 1.05, 'softInOut']]);
});
</script>
</body>
</html>
